<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <!-- Preconnect to critical domains for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Preload critical fonts -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
    </noscript>
    
    <!-- Primary Meta Tags -->
    <title>MedNurse - Medication Safety Education & Clinical Tools for Nurses</title>
    <meta name="description" content="Empowering nurses with evidence-based medication safety education, drug interaction alerts, CE credits, and clinical tools. Trusted by 50,000+ healthcare professionals." />
    <meta name="author" content="MedNurse" />
    <meta name="keywords" content="medication safety, nursing education, drug interactions, CE credits, clinical tools, healthcare, nursing app, medication errors, patient safety" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://mednurse.com" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mednurse.com" />
    <meta property="og:title" content="MedNurse - Safer Medication. Better Care." />
    <meta property="og:description" content="Evidence-based medication safety education and clinical tools for nurses. Real-time drug alerts, CE credits, and resources trusted by 50,000+ healthcare professionals." />
    <meta property="og:image" content="https://mednurse.com/og-image.jpg" />
    <meta property="og:site_name" content="MedNurse" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@MedNurseApp" />
    <meta name="twitter:creator" content="@MedNurseApp" />
    <meta name="twitter:title" content="MedNurse - Safer Medication. Better Care." />
    <meta name="twitter:description" content="Evidence-based medication safety education and clinical tools for nurses. Trusted by 50,000+ healthcare professionals." />
    <meta name="twitter:image" content="https://mednurse.com/og-image.jpg" />

    <!-- Additional SEO -->
    <meta name="theme-color" content="#1e3a5f" />
    <meta name="application-name" content="MedNurse" />
    <meta name="apple-mobile-web-app-title" content="MedNurse" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Security Headers via meta -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
    
    <!-- Skip to main content for accessibility (improves INP) -->
    <style>
      .skip-link {
        position: absolute;
        top: -40px;
        left: 0;
        background: #1e3a5f;
        color: white;
        padding: 8px 16px;
        z-index: 100;
        transition: top 0.3s;
      }
      .skip-link:focus {
        top: 0;
      }
    </style>
  </head>

  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
